<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Route</title>
    <h1>Find your Route</h1>

    <meta name="mapbox-access-token" content="pk.eyJ1Ijoibm9haDEwMSIsImEiOiJjbXZqMDZ4MHowYnI2MnhvdmoyczZvenEwIn0.DLUJBowla0lQQa5LOm9dgQ">
    <link rel="stylesheet" href="style.css">

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js" defer></script>
    <script src="main.js" defer></script>

    <script
      id="search-js"
      defer
      src="https://api.mapbox.com/search-js/v1.2.0/web.js"
      >
    </script>
    <script>
        const script = document.getElementById('search-js');
        script.onload = function() {
            mapboxsearch.autofill({
                accessToken: document.querySelector('meta[name="mapbox-access-token"]').content
            });
        };
    </script>
</head>
<body>
    <p>Enter your address to find closest address. Everything is servside.</p>

    <form id="address-form">
        <div class="search">
            <label class="visually-hidden" for="address">Address</label>
            <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                <path d="M12 3 2.5 11h2.7v9h5.2v-5.8h3.2V20h5.2v-9h2.7L12 3z"></path>
            </svg>
            <input class="search-input" type="text" name="address" id="address" placeholder="Enter Your Address Here" autocomplete="address-line1" required>
        </div>
    </form>

    <p id="map-status" class="map-status" role="status" aria-live="polite"></p>
    <div class="map-container">
        <div class="map-controls">
            <button id="map-view-toggle" class="map-view-switch" type="button" aria-label="Switch to 2D" aria-pressed="true" disabled>
                <span class="switch-track" aria-hidden="true">
                    <span class="switch-thumb"></span>
                    <span class="switch-option switch-option-3d">3D</span>
                    <span class="switch-option switch-option-2d">2D</span>
                </span>
            </button>
        </div>
        <div id="map" aria-label="Interactive 3D map of Phoenix, Arizona"></div>
    </div>
    
</body>
</html>
